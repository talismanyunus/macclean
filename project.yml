name: MacClean
options:
  bundleIdPrefix: com.yunussahin
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
configs:
  Debug: debug
  Release: release
  AppStore: release
targets:
  MacClean:
    type: application
    platform: macOS
    sources:
      - path: Sources/MacClean
        excludes:
          - Resources
      - path: Resources/AppIcon.png
        buildPhase: resources
      - path: Resources/MacClean.icns
        buildPhase: resources
      # PrivacyInfo.xcprivacy lives in Sources/MacClean/Resources so SPM can
      # process it into the bundle; Xcode picks it up via the Sources/MacClean path.
      # The top-level Resources/ copy is kept only as the authoritative source.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yunussahin.macclean
        PRODUCT_NAME: MacClean
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/MacClean.entitlements
        DEVELOPMENT_TEAM: KV6XRM273Q
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # Silence the Xcode privacy manifest validation warning
        PRIVACY_MANIFEST_VALIDATIONS_ENABLED: YES
      configs:
        AppStore:
          OTHER_SWIFT_FLAGS: "$(inherited) -DAPP_STORE"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: YES
          ENABLE_HARDENED_RUNTIME: YES
schemes:
  MacClean:
    build:
      targets:
        MacClean: all
    run:
      config: Debug
    archive:
      config: AppStore
